{% extends "base.html" %}

{% block title %}
Товар
{% endblock %}

{% block content %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
<h1>{{ item_name }}</h1>
<p>Текст: {{ item_text }}</p>
<p>Категория: {{ category }}</p>
<p>Теги:</p>
{% for tag in tags %}
<ul>
    <li>
        {{ tag.name }}
    </li>
</ul>
{% endfor %}

{% endblock %}
