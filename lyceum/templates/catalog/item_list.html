{% extends "base.html" %}

{% block title %}
Товары
{% endblock %}

{% block content %}
<h1>Список товаров</h1>
{% load static %}

{% for item in items %}
<ul>
    <li>
        <a href="{% url 'catalog:item_detail' item.id %}">
            {{ item.name }}
        </a>
    </li>
</ul>
{% endfor %}

{% endblock %}
