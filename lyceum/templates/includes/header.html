<header>
    {% load static %}
    <img src="{% static 'img/logo.jpg' %}" alt="Картинка">
    {% with request.resolver_match.view_name as view_name %}
    <ul class="nav nav-pills">
        <li class="nav-item">
            <a class="nav-link {% if view_name == 'home' %}active{% endif %}" href="{% url 'home' %}">
                На главную
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if view_name == 'description' %}active{% endif %}" href="{% url 'description' %}">
                О проекте
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if view_name == 'item_list' %}active{% endif %}" href="{% url 'item_list' %}">
                Список товаров
            </a>
        </li>
    </ul>
    {% endwith %}
</header>
